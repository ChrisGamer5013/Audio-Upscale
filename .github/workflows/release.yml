name: Release

# Tag pushes (v*) build everything and create/update the GitHub release.
# workflow_dispatch runs the same tests + build but only uploads the
# artifacts to the run (no release), so a manual run never fails with
# "GitHub Releases requires a tag".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Build portable + standalone
        run: python scripts/build_portable.py
        env:
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}\pyi
      - name: Upload build artifacts (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AudioUpscalerHD-windows
          path: |
            dist/AudioUpscalerHD-standalone.exe
            dist/AudioUpscalerHD-portable.zip
            dist/installer/AudioUpscalerHD_Setup.exe
          if-no-files-found: warn
      - name: Attach to release (tag pushes only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/AudioUpscalerHD-standalone.exe
            dist/AudioUpscalerHD-portable.zip
            dist/installer/AudioUpscalerHD_Setup.exe
            models/starter_bwe_48k.onnx
