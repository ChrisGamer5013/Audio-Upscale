name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Build portable + standalone
        run: python scripts/build_portable.py
        env:
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}\pyi
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AudioUpscalerHD-standalone.exe
            dist/AudioUpscalerHD-portable.zip
          generate_release_notes: true
